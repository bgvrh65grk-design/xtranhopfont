
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @font-face {
      font-family: "XTRANHO";
      src: url("https://cdn.jsdelivr.net/gh/bgvrh65grk-design/xtranhopfont@main/XTRANHO-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
    }

    textarea {
      display: block;
      width: 100%;
      height: 600px;
      margin: 0;
      padding: 0;

      border: none;
      outline: none;
      resize: none;
      background: transparent;

      font-family: "XTRANHO", sans-serif !important;
      font-size: 133.33px;
      line-height: 1.2;
      font-weight: 400;

      color: #C6FF33;
      caret-color: #C6FF33;
    }

    textarea::placeholder {
      font-family: "XTRANHO", sans-serif;
      color: #C6FF33;
      opacity: 0.65;
    }

    textarea:focus {
      outline: none;
    }

    ::selection {
      background: #C6FF33;
      color: #000000;
    }
  </style>
</head>

<body>
  <textarea
    placeholder="Comece a escrever..."
    spellcheck="false"
  ></textarea>
</body>
</html>
