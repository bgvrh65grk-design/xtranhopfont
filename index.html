<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@font-face {
  font-family: "XTRANHO";
  src: url("https://cdn.jsdelivr.net/gh/bgvrh65grk-design/xtranhopfont@main/XTRANHO-Regular.otf") format("opentype");
  font-weight: normal;
  font-style: normal;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
}

textarea {
  display: block;
  width: 100%;
  height: 600px;
  padding: 0;
  margin: 0;
  border: none;
  outline: none;
  resize: none;
  background: transparent;

  font-family: "XTRANHO", sans-serif !important;
  font-size: 100pt !important;
  line-height: 1.2;
  font-weight: normal;

  color: #C6FF33;
  caret-color: #C6FF33;
  text-transform: lowercase;
}

textarea::placeholder {
  font-family: "XTRANHO", sans-serif;
  font-size: 100pt;
  color: #C6FF33;
  opacity: 0.65;
  text-transform: lowercase;
}
</style>
</head>

<body>

<textarea
  placeholder="comece a escrever..."
  spellcheck="false"
></textarea>

<script>
const caixa = document.querySelector("textarea");

caixa.addEventListener("input", function() {
  const inicio = this.selectionStart;
  const fim = this.selectionEnd;

  this.value = this.value.toLowerCase();

  this.setSelectionRange(inicio, fim);
});
</script>

</body>
</html>
