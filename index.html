
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @font-face {
      font-family: "XTRANHO";
      src: url("./XTRANHO-Regular.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: transparent;
    }

    textarea {
      display: block;
      width: 100%;
      height: 300px;
      margin: 0;
      padding: 0;

      border: none;
      outline: none;
      resize: none;
      background: transparent;

      font-family: "XTRANHO", sans-serif;
      font-size: 40px;
      line-height: 1.4;
      font-weight: normal;

      color: #C6FF33;
      caret-color: #C6FF33;

      overflow: auto;
    }

    textarea::placeholder {
      color: #C6FF33;
      opacity: 0.65;
    }

    textarea:focus {
      outline: none;
    }

    ::selection {
      background: #C6FF33;
      color: #000000;
    }
  </style>
</head>

<body>

  <textarea
    placeholder="Comece a escrever..."
    spellcheck="false"
  ></textarea>

</body>
</html>
